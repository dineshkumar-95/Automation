name: TestNG UI Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      browserName:
        description: 'Browser name (firefox, chrome, edge, safari)'
        required: false
        default: 'firefox'
        type: string
      platformName:
        description: 'Platform name (e.g., Windows 11, macOS, Linux)'
        required: false
        default: ''
        type: string
      browserVersion:
        description: 'Browser version (e.g., latest, 120, etc.)'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set default values for non-manual triggers
      if: github.event_name != 'workflow_dispatch'
      run: |
        echo "browserName=firefox" >> $GITHUB_ENV
        echo "platformName=" >> $GITHUB_ENV
        echo "browserVersion=" >> $GITHUB_ENV
    
    - name: Set values from manual trigger
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "browserName=${{ github.event.inputs.browserName }}" >> $GITHUB_ENV
        echo "platformName=${{ github.event.inputs.platformName }}" >> $GITHUB_ENV
        echo "browserVersion=${{ github.event.inputs.browserVersion }}" >> $GITHUB_ENV
    
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Set up Firefox and dependencies
      if: env.browserName == 'firefox'
      run: |
        sudo apt-get install -y xvfb firefox wget
    
    - name: Set up Chrome and dependencies
      if: env.browserName == 'chrome'
      run: |
        sudo apt-get install -y xvfb chromium-browser chromium-chromedriver
    
    - name: Start Xvfb
      run: Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
    
    - name: Set up GeckoDriver (Firefox)
      if: env.browserName == 'firefox'
      run: |
        wget https://github.com/mozilla/geckodriver/releases/latest/download/geckodriver-linux64.tar.gz
        tar -xvf geckodriver-linux64.tar.gz
        sudo mv geckodriver /usr/local/bin/
        geckodriver --version
    
    - name: Create directory structure for hardcoded path
      if: env.browserName == 'firefox'
      run: |
        sudo mkdir -p /Users/nilanid/work/Automation
        sudo ln -sf $(which geckodriver) /Users/nilanid/work/Automation/geckodriver\ 2
    
    - name: Install dependencies
      run: mvn clean install -DskipTests
    
    - name: Run UI Tests
      run: mvn test -DbrowserName=${{ env.browserName }} -DplatformName="${{ env.platformName }}" -DbrowserVersion="${{ env.browserVersion }}"
      env:
        DISPLAY: :99
        CI: true
        LT_USERNAME: ${{ secrets.LT_USERNAME }}
        LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ env.browserName }}
        path: target/surefire-reports/
        retention-days: 30
    
    - name: Upload ExtentReports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports-${{ env.browserName }}
        path: target/test-output/
        retention-days: 30
    
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ env.browserName }}
        path: target/test-output/screenshots/
        retention-days: 30