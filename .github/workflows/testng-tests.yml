name: TestNG Automation Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      execution_type:
        description: 'Execution type'
        required: true
        default: 'local'
        type: choice
        options:
        - local
        - cloud

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [firefox, chrome]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Set up Xvfb (virtual display)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
    
    - name: Start Xvfb
      run: Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
    
    - name: Set up Firefox
      if: matrix.browser == 'firefox'
      uses: browser-actions/setup-firefox@latest
      with:
        firefox-version: latest
    
    - name: Set up Chrome
      if: matrix.browser == 'chrome'
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: latest
    
    - name: Set up GeckoDriver (Firefox)
      if: matrix.browser == 'firefox'
      uses: browser-actions/setup-geckodriver@latest
      with:
        geckodriver-version: latest
    
    - name: Set up ChromeDriver
      if: matrix.browser == 'chrome'
      uses: browser-actions/setup-chromedriver@latest
    
    - name: Install dependencies
      run: mvn clean install -DskipTests
    
    - name: Run UI Tests (Local)
      if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.execution_type == 'local')
      run: mvn test -DbrowserName=${{ matrix.browser }}
      env:
        DISPLAY: :99
        CI: true
    
    - name: Run UI Tests (LambdaTest Cloud)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.execution_type == 'cloud'
      run: mvn test -DbrowserName=${{ matrix.browser }} -DplatformName=Windows 11 -DbrowserVersion=latest
      env:
        LT_USERNAME: ${{ secrets.LT_USERNAME }}
        LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        DISPLAY: :99
        CI: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.browser }}
        path: target/surefire-reports/
        retention-days: 30
    
    - name: Upload ExtentReports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extent-reports-${{ matrix.browser }}
        path: target/test-output/
        retention-days: 30
    
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ matrix.browser }}
        path: target/test-output/screenshots/
        retention-days: 30

  api-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Install dependencies
      run: mvn clean install -DskipTests
    
    - name: Run API Tests
      run: mvn test -DsuiteXmlFile=src/test/Resources/testng-suite.xml -Dtest=CustomerAPITests
      env:
        API_BASE_URL: https://dinesh-kumar-test.chargebee.com
        CI: true
    
    - name: Upload API test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: api-test-results
        path: target/surefire-reports/
        retention-days: 30